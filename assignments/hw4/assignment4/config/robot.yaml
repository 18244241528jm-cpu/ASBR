serial_number: j100-0000
version: 0
system:
  hosts:
    - hostname: cpr-j100-0000
      ip: 192.168.131.1
  ros2:
    namespace: "/"
platform:
  attachments:
    - name: front_fender
      type: j100.fender
    - name: rear_fender
      type: j100.fender
      rpy: [0.0, 0.0, 3.1415]
links:
  cylinder:
  - name: cylinder
    parent: default_mount
    xyz: [0.0, 0.0, 0.05]
    rpy: [0.0, 0.0, 0.0]
    radius: 0.05
    length: 0.1
mounts:
  bracket:
  - parent: front_0_mount
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    model: horizontal
  - parent: rear_0_mount
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    model: horizontal
sensors:
  camera: []
  gps: []
  imu: []
  lidar2d: []
